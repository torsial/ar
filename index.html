<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        /* Fix pre celú obrazovku na iOS */
        body { margin: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        .a-canvas { width: 100% !important; height: 100% !important; }
        
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        button { 
            padding: 20px 40px; font-size: 1.2rem; background: #00C957; 
            color: white; border: none; border-radius: 50px; font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0,201,87,0.4);
        }
    </style>
</head>
<body>
    <div id="overlay">
        <button id="startBtn">SPUSTIŤ AR ZÁŽITOK</button>
        <p style="margin-top:20px; color: #888; font-family: sans-serif;">Pripravené pre Barbakán</p>
    </div>


    <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; filterMinCF:0.001; filterBeta: 10;" 
    embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        
        <a-assets>
            <video id="vid" src="video_animacia.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#vid" width="0.95" height="0.65" position="0 0 0.01"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('overlay');
        const sceneEl = document.querySelector('a-scene');
        const video = document.getElementById('vid');

        startBtn.addEventListener('click', () => {
            overlay.style.display = "none";
            // Spustíme AR
            const arSystem = sceneEl.systems["mindar-image-system"];
            arSystem.start(); 
            
            // "Nakopnutie" videa pre iOS
            video.play().then(() => {
                video.pause();
            });
        });

        // Keď krúžok nájde pohľadnicu
        sceneEl.addEventListener("targetFound", () => {
            video.play();
        });

        sceneEl.addEventListener("targetLost", () => {
            video.pause();
        });
    </script>
</body>
</html>
