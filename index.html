<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        button {
            padding: 20px 40px; font-size: 18px; background: #00C957; 
            color: white; border: none; border-radius: 10px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <button onclick="startAR()">POVOLIŤ AR KAMERU</button>
        <p id="msg" style="margin-top: 20px;">Ťukni na tlačidlo</p>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes;" 
        embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="vid" src="video_animacia.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#vid" width="1" height="0.6"></a-video>
        </a-entity>
    </a-scene>

    <script>
        function startAR() {
            const sceneEl = document.querySelector('a-scene');
            const arSystem = sceneEl.systems["mindar-image-system"];
            const msg = document.getElementById('msg');
            
            document.getElementById('overlay').style.display = 'none';
            
            // Pokus o štart
            arSystem.start(); 
            
            // Kontrola po 2 sekundách, či kamera nabehla
            setTimeout(() => {
                if (document.querySelector('video') && document.querySelector('video').videoWidth === 0) {
                    alert("Kamera sa nespustila. Skontroluj: Nastavenia -> Safari -> Kamera -> Povoliť.");
                }
            }, 2000);
        }

        document.querySelector('a-scene').addEventListener("targetFound", () => {
            document.getElementById('vid').play();
        });
    </script>
</body>
</html>
