<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/dist/mindar-image.prod.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #container { width: 100vw; height: 100vh; }
        #btn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; background: #00C957; color: white; 
            border-radius: 15px; font-weight: bold; z-index: 1000; border: none;
        }
    </style>
</head>
<body>
    <button id="btn">SPUSTIŤ AR KAMERU</button>
    <div id="container"></div>

    <script>
        const btn = document.getElementById('btn');
        
        btn.addEventListener('click', async () => {
            btn.style.display = 'none';
            
            const mindarThree = new window.MINDAR.IMAGE.MindARThree({
                container: document.querySelector("#container"),
                imageTargetSrc: './targets.mind',
                uiLoading: "yes",
                uiScanning: "yes"
            });

            const {renderer, scene, camera} = mindarThree;
            
            // Pridanie videa
            const video = document.createElement("video");
            video.src = "./video_animacia.mp4";
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.muted = true;
            video.loop = true;

            try {
                await mindarThree.start();
                renderer.setAnimationLoop(() => {
                    renderer.render(scene, camera);
                });
                alert("AR úspešne naštartované! Namier na pohľadnicu.");
            } catch (err) {
                alert("CHYBA ŠTARTU: " + err.message);
            }
        });
    </script>
</body>
</html>
