<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin:0; background: #000; overflow: hidden;">

    <a-scene id="scene" 
        mindar-image="imageTargetSrc: ./targets.mind?v=123; autoStart: true; uiLoading: yes; uiScanning: yes;" 
        embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="vid" src="video_animacia.mp4?v=123" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#vid" width="1" height="0.6"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const video = document.getElementById('vid');
        const sceneEl = document.querySelector('a-scene');

        // iPhone potrebuje kliknutie na spustenie videa, aj keď je muted
        window.addEventListener('click', () => {
            video.play();
            console.log("Video aktivované kliknutím");
        });

        sceneEl.addEventListener("targetFound", () => {
            console.log("Pohľadnica nájdená!");
            video.play();
        });
    </script>
</body>
</html>
