<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        button { padding: 20px 40px; font-size: 1.2rem; background: #00C957; color: white; border: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="overlay">
        <button id="startBtn">OTVORIŤ AR KAMERU</button>
        <p style="margin-top:20px; color: #888;">Barbakan Projekt v1.0</p>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes;" 
        embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="vid" src="video_animacia.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#vid" width="1" height="0.6"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('overlay');
        const sceneEl = document.querySelector('a-scene');

        startBtn.addEventListener('click', () => {
            // Skryjeme tlačidlo a spustíme AR
            overlay.style.display = "none";
            const arSystem = sceneEl.systems["mindar-image-system"];
            arSystem.start(); 
        });

        // iPhone fix: Video sa musí "nakopnúť" po prvom dotyku
        sceneEl.addEventListener("targetFound", () => {
            const video = document.getElementById('vid');
            video.play();
        });
    </script>
</body>
</html>
