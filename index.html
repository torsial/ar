<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; }
        #debug { position: fixed; top: 0; width: 100%; background: rgba(255,0,0,0.8); z-index: 1000; padding: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="debug">Iniciujem... Ak vidíš toto dlho, tvoj web nemá HTTPS alebo si zakázal kameru.</div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;" 
        embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="vid" src="video_animacia.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#vid" width="1" height="0.6"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const debug = document.getElementById('debug');
        const sceneEl = document.querySelector('a-scene');

        // Kontrola HTTPS
        if (location.protocol !== 'https:') {
            debug.innerHTML = "KRITICKÁ CHYBA: iPhone nepovolí kameru na HTTP! Musíš použiť HTTPS.";
        }

        sceneEl.addEventListener("arReady", () => {
            debug.style.background = "green";
            debug.innerHTML = "AR PRIPRAVENÉ! Namier na pohľadnicu.";
        });

        sceneEl.addEventListener("arError", (e) => {
            debug.innerHTML = "CHYBA AR: " + e.detail;
        });

        window.addEventListener('click', () => {
            document.getElementById('vid').play();
        });
    </script>
</body>
</html>
