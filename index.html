<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; background: #000; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); z-index: 999;
        }
        button {
            padding: 20px 40px; font-size: 20px; font-weight: bold;
            background: #00C957; color: white; border: none; border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <button id="startButton">SPUSTIŤ AR</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes;" 
        embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="vid" src="video_animacia.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#vid" width="1" height="0.6" position="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const startButton = document.getElementById('startButton');
        const overlay = document.getElementById('overlay');
        const sceneEl = document.querySelector('a-scene');

        startButton.addEventListener('click', () => {
            overlay.style.display = 'none';
            // Toto naštartuje kameru až po tvojom kliknutí
            const arSystem = sceneEl.systems["mindar-image-system"];
            arSystem.start(); 
        });

        sceneEl.addEventListener("targetFound", () => {
            document.getElementById('vid').play();
        });
    </script>
</body>
</html>
